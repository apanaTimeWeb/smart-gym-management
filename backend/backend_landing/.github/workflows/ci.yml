name: backend-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_smart_master
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gym_smart_master"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript strict compile
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Architecture and import-order gates
        run: npm run architecture:verify
      - name: Prettier
        run: npx prettier --check .
      - name: Unit tests
        run: npm test -- --coverage
      - name: Dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high
      - name: Secrets detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
      - name: SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/ci
            p/typescript
