name: backend-ci
on: [push, pull_request]
jobs:
  build-test-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: gymsmart_master }
        ports: ['5432:5432']
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run architecture:check
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
