services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gymsmart_master
      POSTGRES_USER: gymsmart
      POSTGRES_PASSWORD: gymsmart
    ports: ["5432:5432"]
    volumes: ["gymsmart-postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymsmart -d gymsmart_master"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8
    ports: ["6379:6379"]
    volumes: ["gymsmart-redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  gymsmart-postgres-data:
  gymsmart-redis-data:
